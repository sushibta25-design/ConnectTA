name: Build ConnectTA App Bridge
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl fakeroot git libtinfo6 libxml2 make perl rsync zip xz-utils
      - name: Install Theos and iOS toolchain
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/toolchain
          curl -L https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C $HOME/theos/toolchain
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Install SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks
      - name: Validate configuration
        run: python3 tests/check_config.py
      - run: make clean package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: ConnectTA-0.4.6-ROOTLESS
          path: packages/*.deb
          if-no-files-found: error
