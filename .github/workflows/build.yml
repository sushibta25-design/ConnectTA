name: Build ConnectTA App Bridge
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install ldid xz
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Install SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks
      - name: Validate configuration
        run: python3 tests/check_config.py
      - name: Build rootless package
        run: make clean package FINALPACKAGE=1
      # Rootful jailbreaks (Taurine on iOS 14, palera1n rootful, checkra1n)
      # install to / and only resolve dependencies for iphoneos-arm. Taurine
      # tops out at iOS 14.8.1, so this package targets iOS 14.0 and later.
      - name: Build rootful package
        run: |
          sed -i '' 's/^Architecture: .*/Architecture: iphoneos-arm/' control
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME= TARGET=iphone:clang:latest:14.0
      - uses: actions/upload-artifact@v4
        with:
          name: ConnectTA-0.4.0-ROOTLESS
          path: packages/*_iphoneos-arm64.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ConnectTA-0.4.0-ROOTFUL
          path: packages/*_iphoneos-arm.deb
          if-no-files-found: error

