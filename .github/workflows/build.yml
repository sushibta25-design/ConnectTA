name: Build ConnectTA App Bridge
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install ldid xz
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Install SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks
      - name: Validate configuration
        run: python3 tests/check_config.py
      - run: make clean package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: ConnectTA-0.4.6-ROOTLESS
          path: packages/*.deb
          if-no-files-found: error

