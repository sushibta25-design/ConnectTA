name: Build Netflix Diagnostic
on:
  push:
    branches: [ diagnostic/netflix-output ]
    paths:
      - 'tools/netflixdiag/**'
      - '.github/workflows/netflixdiag.yml'
  workflow_dispatch:
concurrency:
  group: netflixdiag-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl fakeroot git libtinfo6 libxml2 make perl rsync zip xz-utils
      - name: Install Theos and iOS toolchain
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/toolchain
          curl -L https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C $HOME/theos/toolchain
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Install SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks
      - name: Validate diagnostic scope
        run: python3 tools/netflixdiag/tests/check_config.py
      - name: Build diagnostic package
        run: make -C tools/netflixdiag clean package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: NetflixDiag-0.1.0-ROOTLESS
          path: tools/netflixdiag/packages/*.deb
          if-no-files-found: error
